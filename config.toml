enable-module-update = true
parallel-jobs = 1
patches-version = "latest"
cli-version = "latest"

# add 'enabled = false' for not patching a specific app or remove it from the config
# see https://github.com/elohim-etz/morphe-builder/blob/main/CONFIG.md for more detailed explanations

# you can use rvmm-config-gen to generate a config

# Morphe
[YouTube]
app-name = "YouTube"
patches-source = "MorpheApp/morphe-patches"
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"          # apk only: the "module" builds are for rooted phones
arch = "arm64-v8a"          # your Realme is arm64
apkmirror-dlurl = "https://www.apkmirror.com/apk/google-inc/youtube"
archive-dlurl = "https://archive.org/download/jhc-apks/apks/com.google.android.youtube"

[Duolingo]
app-name = "Duolingo"
patches-source = "hoo-dles/morphe-patches"   # Duolingo patches aren't in the official Morphe bundle
cli-source = "MorpheApp/morphe-cli"
rv-brand = "Morphe"
build-mode = "apk"
dpi = "nodpi anydpi 120-640dpi"   # APKMirror only has Duolingo as a split bundle; the builder merges it
apkmirror-dlurl = "https://www.apkmirror.com/apk/duolingo/duolingo-duolingo"
